<!DOCTYPE html>
<html>

<head>
	<title>Musical Evenings At 847</title>
	<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
	<style type="text/css">
		html,
		body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: auto;
		}

		#childIframe {
			position: absolute;
			left: 0;
			right: 0;
			top: 0;
			bottom: 0;
			border: 0;
			width: 100%;
			height: 100%;
		}
	</style>
</head>

<body>

	<script>
		function setCookie(name, value, days) {
			let expires = "";
			if (days) {
				const date = new Date();
				date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
				expires = "; expires=" + date.toUTCString();
			}
			document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/";
		}

		function getCookie(name) {
			const nameEQ = name + "=";
			const ca = document.cookie.split('; ');

			// Loop through the cookie array
			for (let i = 0; i < ca.length; i++) {
				let c = ca[i];
				// If the cookie string starts with the name we're looking for,
				// return the value part after the "=" sign, decoded
				if (c.startsWith(nameEQ)) {
					return decodeURIComponent(c.substring(nameEQ.length));
				}
			}

			// Return null if the cookie is not found
			return null;
		}

		// Get query parameters from the URL (window.location.search) 
		const queryParams = new URLSearchParams(window.location.search);

		var id = queryParams.get('id')
		if (id) {
			setCookie('id', id, 45); // Sets as a cookie for 45 days
		} else {
			id = getCookie('id'); // Try to get from cookie if not in URL
		}
	</script>

	<!-- Iframe element -->
	<iframe id="childIframe" width="100%" height="100vh" max-width="100%"
		sandbox="allow-forms allow-modals allow-orientation-lock allow-popups allow-same-origin allow-scripts"
		allowfullscreen mozallowfullscreen msallowfullscreen webkitallowfullscreen></iframe>

	<script>
		// Get the iframe element 
		const iframe = document.getElementById('childIframe');

		if (id) {
			// Define parameters to pass 
			const params = { id: id };

			const response = queryParams.get('response')
			if (response) {
				params.response = response;
			}

			// Convert params to query string
			const queryString = new URLSearchParams(params).toString();

			// Set iframe src with query parameters 
			if (window.innerHeight >= 900) iframe.style.height = '100vh';
			iframe.src = `https://script.google.com/macros/s/AKfycbwV8YQChOJzBchS9kKMhBjStUzdVBTcGs1P1TaiPK7K38RZ6VdR6diKlHAHLOhaUKTUwg/exec?${queryString}`;
		} else {
			iframe.style.height = '100%';
			iframe.setAttribute('scrolling', 'no');
			iframe.src = 'https://sway.cloud.microsoft/s/URXPCzrQmPUmolMG/embed';
		}

	</script>
</body>

</html>
